[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soloist-product-agent"
version = "0.1.0"
description = "Product discovery, pricing and Telegram draft delivery for SOLOIST"
requires-python = ">=3.11"
dependencies = ["Pillow>=12,<13", "playwright>=1.60,<2"]

[project.scripts]
soloist-agent = "soloist_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
